<VirtualHost *:80>
    ServerName localhost
    # Nếu bạn có tên miền, hãy thay đổi localhost thành tên miền của bạn (vd: phimtop1.com)

    DocumentRoot /home/khoa/PhimTop1-API-Hub
    
    # Cấu hình log
    ErrorLog /var/log/httpd/phimtop1-error.log
    CustomLog /var/log/httpd/phimtop1-access.log combined

    # Bật Proxy để chuyển hướng request tới Node.js (cổng 3000)
    ProxyPreserveHost On
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # Quyền truy cập thư mục
    <Directory "/home/khoa/PhimTop1-API-Hub">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
