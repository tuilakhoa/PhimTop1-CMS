name: Build WinUI 3 App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore PhimTop1WinUI/PhimTop1WinUI.csproj -PackagesDirectory packages

    - name: Restore dotnet tools
      run: dotnet restore PhimTop1WinUI/PhimTop1WinUI.csproj -r win-x64 -p:Platform=x64

    - name: Build with MSBuild
      run: msbuild PhimTop1WinUI/PhimTop1WinUI.csproj /p:Configuration=Release /p:Platform=x64 /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /restore

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhimTop1WinUI-Release-EXE
        path: PhimTop1WinUI/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
