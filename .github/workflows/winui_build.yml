name: Build WinUI 3 App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore PhimTop1WinUI/PhimTop1WinUI.csproj -r win-x64 -p:Platform=x64

    - name: Build and Publish EXE
      # Remove the MSIX-specific parameters. Just standard dotnet publish.
      run: dotnet publish PhimTop1WinUI/PhimTop1WinUI.csproj -c Release -r win-x64 --no-restore -p:Platform=x64 -p:PublishProfile=win-x64.pubxml

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhimTop1WinUI-Release-EXE
        path: PhimTop1WinUI/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish/
